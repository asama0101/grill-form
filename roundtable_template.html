<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roundtable</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2430; --muted: #667085;
  --border: #d6dae1; --accent: #2f6fed; --accent-weak: #e8efff;
  --rec: #1a7f4b; --rec-weak: #e4f5ec; --warn: #b54708;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b; --card: #1d2027; --text: #e6e8ee; --muted: #9aa3b2;
    --border: #343a46; --accent: #6b9bff; --accent-weak: #232c44;
    --rec: #54c58b; --rec-weak: #1c2e25; --warn: #f0a04b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 80px; background: var(--bg); color: var(--text);
  font: 15px/1.7 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.intro, .summary { background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
.q { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; margin-bottom: 16px; }
.q.hold { opacity: .7; }
.q h2 { font-size: 16px; margin: 0 0 8px; }
.q .id { color: var(--accent); margin-right: 6px; }
.body { margin-bottom: 12px; }
.body p { margin: 0 0 8px; white-space: pre-wrap; }
.body ul { margin: 0 0 8px; padding-left: 1.4em; }
.body code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 13px; }
.body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; overflow-x: auto; margin: 0 0 8px; }
.body pre code { border: 0; padding: 0; }
.body .md-h { margin: 18px 0 8px; line-height: 1.4; }
.body h3.md-h { font-size: 18px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
.body h4.md-h { font-size: 16px; padding-left: 8px; border-left: 4px solid var(--accent); }
.body h5.md-h, .body h6.md-h { font-size: 15px; color: var(--accent); }
.body > .md-h:first-child { margin-top: 0; }
.body ol { margin: 0 0 8px; padding-left: 1.6em; }
.body li { margin: 2px 0; }
.body hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.body blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 4px solid var(--border); color: var(--muted); }
.summary { padding: 18px 22px; }
.body .tbl { overflow-x: auto; margin: 0 0 8px; }
.body table { border-collapse: collapse; font-size: 14px; }
.body th, .body td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; vertical-align: top; }
.body th { background: var(--bg); font-weight: 700; }
details.long > summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; margin: 6px 0;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { background: var(--accent-weak); border-color: var(--accent); }
.opt input { margin-top: 5px; }
.opt .key { font-weight: 700; min-width: 1.4em; }
.opt .desc { color: var(--muted); font-size: 13px; display: block; white-space: pre-wrap; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--rec);
  background: var(--rec-weak); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.reason { font-size: 13px; color: var(--rec); background: var(--rec-weak); border-radius: 8px;
  padding: 8px 12px; margin: 10px 0; white-space: pre-wrap; }
label.field { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
textarea { width: 100%; min-height: 56px; margin-top: 4px; padding: 8px 10px; resize: vertical;
  color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  font: inherit; }
.hold-row { margin-top: 10px; font-size: 14px; }
.bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0;
  border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
button.clear { font-size: 13px; padding: 2px 12px; margin: 2px 0 4px; color: var(--muted); }
#status { font-size: 13px; color: var(--muted); }
#status.warn { color: var(--warn); }
#status.ok { color: var(--rec); font-weight: 700; }
.approve label { margin-right: 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div id="content"></div>
  <div class="bar">
    <button class="primary" id="submit">送信</button>
    <button id="copy">Markdown をコピー</button>
    <span id="status"></span>
  </div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var content = document.getElementById('content');
  var statusEl = document.getElementById('status');
  window.__answersMd = '';
  window.__submitted = false;

  document.title = data.title || 'roundtable';
  document.getElementById('title').textContent = data.title || 'roundtable';
  document.getElementById('meta').textContent =
    'セッション: ' + data.session + ' ／ ラウンド: ' + data.round +
    (data.mode === 'final' ? ' ／ 最終確認' : '');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var blocks = []; // 質問ごとの読み取り関数

  // 簡易 Markdown（段落・箇条書き・コードブロック・インラインコード）。innerHTML は使わない
  function inline(parent, text) {
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function (part) {
      if (/^`[^`]+`$/.test(part)) parent.appendChild(el('code', '', part.slice(1, -1)));
      else if (/^\*\*[^*]+\*\*$/.test(part)) parent.appendChild(el('strong', '', part.slice(2, -2)));
      else if (part) parent.appendChild(document.createTextNode(part));
    });
  }
  var TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  function tableCells(line) {
    // 先頭・末尾の | を外し、エスケープされていない | で分ける（\| は文字としての |）
    var s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    return s.split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); });
  }
  function mdLite(text) {
    var root = el('div', 'body');
    var lines = text.split(/\r?\n/), i = 0, para = [], list = null;
    function flush() {
      if (para.length) { var p = el('p'); inline(p, para.join('\n')); root.appendChild(p); para = []; }
      list = null;
    }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        flush();
        var code = [];
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
        var pre = el('pre'); pre.appendChild(el('code', '', code.join('\n'))); root.appendChild(pre);
      } else if (/^\s*\|/.test(ln) && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
        flush();
        var head = tableCells(ln), aligns = tableCells(lines[i + 1]).map(function (c) {
          return /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : /^:-/.test(c) ? 'left' : '';
        });
        var table = el('table'), thead = el('thead'), htr = el('tr');
        head.forEach(function (c, k) {
          var th = el('th'); inline(th, c); if (aligns[k]) th.style.textAlign = aligns[k]; htr.appendChild(th);
        });
        thead.appendChild(htr); table.appendChild(thead);
        var tbody = el('tbody');
        for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
          var tr = el('tr');
          tableCells(lines[i]).forEach(function (c, k) {
            var td = el('td'); inline(td, c); if (aligns[k]) td.style.textAlign = aligns[k]; tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
        i--; // 外側の i++ で表の次の行へ進む
        table.appendChild(tbody);
        var wrap = el('div', 'tbl'); wrap.appendChild(table); root.appendChild(wrap);
      } else if (/^#{1,4} /.test(ln)) {
        flush();
        var lv = ln.match(/^#+/)[0].length;
        var hd = el('h' + (lv + 2)); hd.className = 'md-h'; inline(hd, ln.replace(/^#+ +/, '')); root.appendChild(hd);
      } else if (/^\s*(?:-{3,}|\*{3,})\s*$/.test(ln)) {
        flush();
        root.appendChild(el('hr'));
      } else if (/^>/.test(ln)) {
        flush();
        var bq = el('blockquote');
        for (; i < lines.length && /^>/.test(lines[i]); i++) {
          if (bq.childNodes.length) bq.appendChild(document.createElement('br'));
          inline(bq, lines[i].replace(/^> ?/, ''));
        }
        i--;
        root.appendChild(bq);
      } else if (/^\s*(?:[-*]|\d+[.)]) /.test(ln)) {
        if (para.length) flush();
        var tag = /^\s*\d+[.)] /.test(ln) ? 'ol' : 'ul';
        if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag); root.appendChild(list); }
        var li = el('li'); inline(li, ln.replace(/^\s*(?:[-*]|\d+[.)]) /, '')); list.appendChild(li);
      } else if (!ln.trim()) {
        flush();
      } else {
        list = null; para.push(ln);
      }
      i++;
    }
    flush();
    return root;
  }
  function card_md(cls, text) {
    var box = el('div', cls);
    box.appendChild(mdLite(text));
    return box;
  }
  function renderBody(text) {
    var node = mdLite(text);
    // 長い本文は折りたたむ（既定は閉じる）
    if (text.length <= 400 && text.split('\n').length <= 12) return node;
    var d = el('details', 'long');
    d.appendChild(el('summary', '', '詳細を表示（' + text.length + ' 文字）'));
    d.appendChild(node);
    return d;
  }

  function renderQuestion(q) {
    var card = el('section', 'q');
    var h = el('h2');
    h.appendChild(el('span', 'id', q.id));
    h.appendChild(document.createTextNode(q.title));
    card.appendChild(h);
    if (q.body) card.appendChild(renderBody(q.body));

    var rec = q.recommended || [];
    var inputs = [];
    (q.options || []).forEach(function (o) {
      var label = el('label', 'opt');
      var input = document.createElement('input');
      input.type = q.multi ? 'checkbox' : 'radio';
      input.name = q.id;
      input.value = o.key;
      inputs.push(input);
      label.appendChild(input);
      var box = el('span');
      var line = el('span');
      line.appendChild(el('span', 'key', o.key + '.'));
      line.appendChild(document.createTextNode(' ' + o.label));
      if (rec.indexOf(o.key) >= 0) line.appendChild(el('span', 'badge', '推奨'));
      box.appendChild(line);
      if (o.desc) box.appendChild(el('span', 'desc', o.desc));
      label.appendChild(box);
      card.appendChild(label);
    });
    if (inputs.length) {
      // 一度選ぶとラジオボタンは外せないので、選択なし（自由入力だけ）に戻すボタンを置く
      var clear = el('button', 'clear', '選択をクリア');
      clear.type = 'button';
      clear.addEventListener('click', function () {
        inputs.forEach(function (i) { i.checked = false; });
      });
      card.appendChild(clear);
    }
    if (q.reason) card.appendChild(el('div', 'reason', '推奨の理由: ' + q.reason));

    var f1 = el('label', 'field', (q.options && q.options.length)
      ? '自由入力（候補にない回答は「その他」を選ばずここに書いてOK）'
      : '回答（自由記述）');
    var free = document.createElement('textarea');
    f1.appendChild(free);
    card.appendChild(f1);
    var f2 = el('label', 'field', '補足コメント');
    var note = document.createElement('textarea');
    f2.appendChild(note);
    card.appendChild(f2);
    var f3 = el('label', 'field', '聞き返し（質問が分からない・確認したいこと。書くと「要確認」になり、次のラウンドで Claude が説明か補足質問を返します）');
    var ask = document.createElement('textarea');
    f3.appendChild(ask);
    card.appendChild(f3);

    var hr = el('div', 'hold-row');
    var holdLabel = el('label');
    var hold = document.createElement('input');
    hold.type = 'checkbox';
    holdLabel.appendChild(hold);
    holdLabel.appendChild(document.createTextNode(' あとで決める（保留）'));
    hr.appendChild(holdLabel);
    card.appendChild(hr);
    hold.addEventListener('change', function () { card.classList.toggle('hold', hold.checked); });

    content.appendChild(card);
    blocks.push(function () {
      var sel = inputs.filter(function (i) { return i.checked; }).map(function (i) { return i.value; });
      var freeText = free.value.trim();
      var askText = ask.value.trim();
      var state = hold.checked ? '保留' : askText ? '要確認' : ((sel.length || freeText) ? '回答' : '未回答');
      return { id: q.id, sel: sel, free: freeText, note: note.value.trim(), ask: askText, state: state };
    });
  }

  function oneLine(s) { return s.replace(/\r?\n/g, ' / '); }

  function buildQuestionsMd() {
    var unanswered = [];
    var md = '';
    blocks.forEach(function (read) {
      var r = read();
      if (r.state === '未回答') unanswered.push(r.id);
      md += '## ' + r.id + '\n' +
        '- 選択: ' + r.sel.join(', ') + '\n' +
        '- 自由入力: ' + oneLine(r.free) + '\n' +
        '- 補足: ' + oneLine(r.note) + '\n' +
        '- 聞き返し: ' + oneLine(r.ask) + '\n' +
        '- 状態: ' + r.state + '\n';
    });
    return { md: md, unanswered: unanswered };
  }

  var approveGet = null;
  function renderFinal() {
    if (data.intro) content.appendChild(card_md('intro', data.intro));
    content.appendChild(card_md('summary', data.summary || ''));
    var card = el('section', 'q approve');
    card.appendChild(el('h2', '', '承認'));
    var row = el('div');
    ['承認', '修正あり'].forEach(function (v, i) {
      var l = el('label');
      var r = document.createElement('input');
      r.type = 'radio'; r.name = 'approve'; r.value = v;
      if (i === 0) r.checked = false;
      l.appendChild(r);
      l.appendChild(document.createTextNode(' ' + v));
      row.appendChild(l);
    });
    card.appendChild(row);
    var f = el('label', 'field', '修正コメント（「修正あり」の場合は必須）');
    var ta = document.createElement('textarea');
    f.appendChild(ta);
    card.appendChild(f);
    content.appendChild(card);
    approveGet = function () {
      var c = card.querySelector('input[name=approve]:checked');
      return { verdict: c ? c.value : '', comment: ta.value.trim() };
    };
  }

  if (data.mode === 'final') {
    renderFinal();
  } else {
    if (data.intro) content.appendChild(card_md('intro', data.intro));
    (data.questions || []).forEach(renderQuestion);
  }

  function build() {
    // 最終確認は round ではなく final（版番号）として書き、ラウンドの回答と区別する
    var head = '---\nsession: ' + data.session + '\n' + (data.mode === 'final' ? 'final: ' : 'round: ') + data.round + '\n---\n';
    if (data.mode === 'final') {
      var a = approveGet();
      if (!a.verdict) return { error: '「承認」か「修正あり」を選んでください。' };
      if (a.verdict === '修正あり' && !a.comment) return { error: '修正コメントを入力してください。' };
      return { md: head + '## 承認\n- 判定: ' + a.verdict + '\n- コメント: ' + oneLine(a.comment) + '\n' };
    }
    var q = buildQuestionsMd();
    return { md: head + q.md, unanswered: q.unanswered };
  }

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  document.getElementById('submit').addEventListener('click', function () {
    var r = build();
    if (r.error) { setStatus(r.error, 'warn'); return; }
    if (r.unanswered && r.unanswered.length && !window.__forceSubmit) {
      window.__forceSubmit = true; // 2回目の押下で未回答のまま送信
      setStatus('未回答: ' + r.unanswered.join(', ') + '。このままなら、もう一度「送信」を押してください。', 'warn');
      return;
    }
    window.__answersMd = r.md;
    window.__submitted = true;
    setStatus('送信しました。Claude が自動で受け取ります。', 'ok');
  });

  document.getElementById('copy').addEventListener('click', function () {
    var r = build();
    if (r.error) { setStatus(r.error, 'warn'); return; }
    var done = function () { setStatus('Markdown をコピーしました。', 'ok'); };
    var fallback = function () {
      var t = document.createElement('textarea');
      t.value = r.md; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { setStatus('コピーに失敗しました。', 'warn'); }
      document.body.removeChild(t);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r.md).then(done, fallback);
    } else { fallback(); }
  });
})();
</script>
</body>
</html>
