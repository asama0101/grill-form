<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grill-form</title>
<style>
:root {
  --bg: #f3f4f7; --panel: #ffffff; --text: #0f1b2d; --muted: #5f6b7d; --line: #d3d9e2; --line-weak: #e6e9ef;
  --sel: #2b4a8b; --sel-weak: #e7edf9; --rec: #1c7769; --rec-weak: #e0f1ee; --warn: #9a5200;
  --mono: "BIZ UDGothic", "Cascadia Mono", Consolas, monospace;
  --sans: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11151b; --panel: #1a1f27; --text: #e8ebf1; --muted: #9aa4b4; --line: #38404c; --line-weak: #2a313b;
    --sel: #8fb0ff; --sel-weak: #1f2b45; --rec: #5fcdb8; --rec-weak: #17302b; --warn: #f0a04b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 var(--sans); }
.shell { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: 224px 1fr; gap: 0 28px; padding: 24px 16px 0; }
aside { position: sticky; top: 24px; align-self: start; padding-top: 6px; }
aside h2 { font-size: 13px; font-weight: 700; margin: 0 0 8px; color: var(--muted); }
.steps { list-style: none; margin: 0 0 18px; padding: 0; font-size: 13.5px; }
.steps li { display: flex; gap: 8px; align-items: center; padding: 3px 0; color: var(--muted); }
.steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.steps li.done::before { background: var(--muted); border-color: var(--muted); }
.steps li.cur { color: var(--text); font-weight: 700; }
.steps li.cur::before { border-color: var(--sel); background: var(--sel); box-shadow: 0 0 0 3px var(--sel-weak); }
.idx { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 2px; }
.idx a { display: grid; grid-template-columns: 34px 1fr 16px; gap: 4px; padding: 5px 8px; font-size: 13px; color: var(--text);
  text-decoration: none; line-height: 1.5; border-radius: 8px; cursor: pointer; }
.idx a:hover { background: var(--sel-weak); }
.idx a.cur { background: var(--sel); color: var(--panel); font-weight: 700; }
.idx .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idx .st { text-align: center; font-family: var(--mono); color: var(--muted); }
.idx .st.ok { color: var(--rec); } .idx .st.ask { color: var(--warn); } .idx .st.hold { color: var(--warn); }
.idx a.cur .st { color: var(--panel); }
.count { font-size: 12px; color: var(--muted); margin: 0; }
main { min-width: 0; }
header.top { padding: 4px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
h1 { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; }
.meta { font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 2px 0 0; }
.intro, .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 12px 0; }
.summary { padding: 18px 22px; }
.q { position: relative; padding: 20px 20px 22px; margin: 8px -20px; border: 2px solid transparent; border-radius: 14px;
  scroll-margin-top: 24px; transition: background .15s, border-color .15s; }
.q.active { background: var(--panel); border-color: var(--sel); }
.q.hold { opacity: .75; }
.q h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.5; font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.pill { font: 700 12px/1 var(--mono); padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); flex: none; }
.now { display: none; margin-left: auto; flex: none; align-self: center; font: 700 12px/1 var(--sans); color: var(--panel); background: var(--sel); border-radius: 999px; padding: 5px 10px; }
.q.active .now { display: inline-block; }
.body { font-size: 14px; color: var(--muted); max-width: 66ch; margin-bottom: 12px; }
.body p { margin: 0 0 8px; white-space: pre-wrap; }
.body ul { margin: 0 0 8px; padding-left: 1.4em; }
.body code { font-family: var(--mono); font-size: 12.5px; background: var(--line-weak); padding: 1px 5px; border-radius: 4px; }
.body pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; overflow-x: auto; margin: 0 0 8px; }
.body pre code { border: 0; padding: 0; background: none; }
.body .md-h { margin: 18px 0 8px; line-height: 1.4; color: var(--text); }
.body h3.md-h { font-size: 17px; padding-left: 10px; border-left: 3px solid var(--sel); }
.body h4.md-h { font-size: 15.5px; }
.body h5.md-h, .body h6.md-h { font-size: 15px; color: var(--muted); }
.body > .md-h:first-child { margin-top: 0; }
.body ol { margin: 0 0 8px; padding-left: 1.6em; }
.body li { margin: 2px 0; }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.body blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 4px solid var(--line); color: var(--muted); }
.summary .body, .intro .body { max-width: 72ch; font-size: 14.5px; color: var(--text); margin-bottom: 0; }
.body .tbl { overflow-x: auto; margin: 0 0 8px; }
.body table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
.body th, .body td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.body th { font-size: 12.5px; color: var(--muted); border-bottom-width: 2px; }
details.long > summary { cursor: pointer; color: var(--sel); font-size: 13px; margin-bottom: 8px; }
.opts { display: grid; gap: 6px; max-width: 700px; }
.q h2 + .opts { margin-top: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 9px 12px 9px 10px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.q:not(.active) .opt { background: var(--panel); }
.opt:hover { border-color: var(--sel); }
.opt input { position: absolute; opacity: 0; }
.cap { width: 30px; height: 30px; display: grid; place-items: center; font: 700 14px/1 var(--mono); border: 1px solid var(--line);
  border-bottom-width: 3px; border-radius: 6px; background: var(--bg); }
.opt:has(input:checked) { background: var(--sel-weak); border-color: var(--sel); }
.opt:has(input:checked) .cap { background: var(--sel); color: var(--panel); border-color: var(--sel); }
.opt:has(input:focus-visible) { outline: 2px solid var(--sel); outline-offset: 2px; }
.opt .l { font-weight: 700; }
.opt .tag { margin-left: 8px; font-size: 12px; font-weight: 700; color: var(--rec); background: var(--rec-weak); border-radius: 999px; padding: 1px 9px; }
.opt .tag::before { content: "✓ "; }
.opt .d { display: block; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
.why { max-width: 700px; margin: 8px 0 0; padding: 6px 12px; background: var(--rec-weak); border-radius: 6px; font-size: 13px; color: var(--rec); white-space: pre-wrap; }
.more { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.tg { font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.tg[aria-expanded=true] { color: var(--text); border-color: var(--sel); background: var(--sel-weak); }
.tg[aria-pressed=true] { color: var(--warn); border-color: var(--warn); }
.tg.dot::after { content: " ●"; color: var(--sel); font-size: 10px; }
.extra { display: none; max-width: 700px; margin-top: 4px; }
.extra.open { display: block; }
label.field, .fl { display: block; font-size: 12.5px; color: var(--muted); margin: 14px 0 4px; }
textarea, input[type=text] { display: block; width: 100%; max-width: 700px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
textarea { min-height: 56px; }
textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.field-row { display: flex; gap: 8px; max-width: 700px; margin-top: 4px; }
.field-row input { flex: 1; min-width: 0; margin: 0; }
label.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; margin-top: 8px; color: var(--text); }
.note { font-size: 12.5px; color: var(--muted); max-width: 66ch; margin: 6px 0 0; }
button { font: inherit; font-size: 14px; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.primary { background: var(--sel); border-color: var(--sel); color: var(--panel); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
button.clear { font-size: 12.5px; padding: 1px 10px; color: var(--muted); }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg label { padding: 10px 26px; cursor: pointer; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; }
.seg label:has(input:checked) { background: var(--sel); color: var(--panel); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--sel); outline-offset: -4px; }
.seg label:has(input[value=修正あり]:checked) { background: var(--warn); }
.bar { position: sticky; bottom: 0; margin: 0 -16px; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#status { font-size: 13px; color: var(--muted); }
#status.warn { color: var(--warn); }
#status.ok { color: var(--rec); font-weight: 700; }
.hint { margin-left: auto; font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; }
kbd { font: 700 11.5px/1 var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--text); }
@media (max-width: 760px) { .shell { grid-template-columns: 1fr; } aside { display: none; } .hint { display: none; } .q { margin-left: -8px; margin-right: -8px; padding: 16px 12px; } }
@media (prefers-reduced-motion: reduce) { .q { transition: none; } }
.in-refresh { display: flex; gap: 12px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
.in-refresh .note { margin: 0; }
.in-box { margin-top: 12px; }
.in-box > .note { margin: 0 0 6px; }
.in-pick { display: grid; grid-template-columns: 240px 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  min-height: 200px; margin: 8px 0; max-width: 100%; }
.in-pick.one { grid-template-columns: 1fr; }
.in-tree { border-right: 1px solid var(--line); padding: 6px; background: var(--bg); font-size: 14px; overflow: auto; max-height: 260px; }
.in-pick.one .in-tree { border-right: 0; max-height: 220px; }
.in-node { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.in-node:hover { background: var(--sel-weak); }
.in-node.cur { background: var(--sel); color: var(--panel); font-weight: 700; }
.in-tw { display: inline-block; width: 12px; color: var(--muted); font-size: 10px; }
.in-node.cur .in-tw { color: var(--panel); }
.in-node input { margin: 0; }
.in-files { padding: 8px 12px; overflow: auto; max-height: 260px; }
.in-where { font: 12px var(--mono); color: var(--muted); margin-bottom: 6px; word-break: break-all; }
.in-file { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 14px; cursor: pointer; user-select: none; }
.in-chosen { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin-top: 8px; max-width: 700px; }
.in-chosen b { font-size: 12px; color: var(--muted); }
.in-it { display: flex; gap: 10px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line-weak); }
.in-p { font: 12.5px var(--mono); flex: 1; word-break: break-all; }
.in-tag { font: 700 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.note.warn { color: var(--warn); }
</style>
</head>
<body>
<div class="shell">
  <aside id="side"></aside>
  <main>
    <header class="top">
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </header>
    <div id="content"></div>
    <div class="bar">
      <button class="primary" id="submit">送信</button>
      <button id="copy">Markdown をコピー</button>
      <button id="abort">中止</button>
      <span id="status"></span>
      <span class="hint" id="hint"></span>
    </div>
  </main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var content = document.getElementById('content');
  var statusEl = document.getElementById('status');
  window.__answersMd = '';
  window.__submitted = false;

  document.title = data.title || 'grill-form';
  document.getElementById('title').textContent = data.title || 'grill-form';
  document.getElementById('meta').textContent = data.session;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var blocks = []; // 質問ごとの読み取り関数

  // 簡易 Markdown（段落・箇条書き・コードブロック・インラインコード）。innerHTML は使わない
  function inline(parent, text) {
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function (part) {
      if (/^`[^`]+`$/.test(part)) parent.appendChild(el('code', '', part.slice(1, -1)));
      else if (/^\*\*[^*]+\*\*$/.test(part)) parent.appendChild(el('strong', '', part.slice(2, -2)));
      else if (part) parent.appendChild(document.createTextNode(part));
    });
  }
  var TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  function tableCells(line) {
    // 先頭・末尾の | を外し、エスケープされていない | で分ける（\| は文字としての |）
    var s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    return s.split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); });
  }
  function mdLite(text) {
    var root = el('div', 'body');
    var lines = text.split(/\r?\n/), i = 0, para = [], list = null;
    function flush() {
      if (para.length) { var p = el('p'); inline(p, para.join('\n')); root.appendChild(p); para = []; }
      list = null;
    }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        flush();
        var code = [];
        for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
        var pre = el('pre'); pre.appendChild(el('code', '', code.join('\n'))); root.appendChild(pre);
      } else if (/^\s*\|/.test(ln) && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
        flush();
        var head = tableCells(ln), aligns = tableCells(lines[i + 1]).map(function (c) {
          return /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : /^:-/.test(c) ? 'left' : '';
        });
        var table = el('table'), thead = el('thead'), htr = el('tr');
        head.forEach(function (c, k) {
          var th = el('th'); inline(th, c); if (aligns[k]) th.style.textAlign = aligns[k]; htr.appendChild(th);
        });
        thead.appendChild(htr); table.appendChild(thead);
        var tbody = el('tbody');
        for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
          var tr = el('tr');
          tableCells(lines[i]).forEach(function (c, k) {
            var td = el('td'); inline(td, c); if (aligns[k]) td.style.textAlign = aligns[k]; tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
        i--; // 外側の i++ で表の次の行へ進む
        table.appendChild(tbody);
        var wrap = el('div', 'tbl'); wrap.appendChild(table); root.appendChild(wrap);
      } else if (/^#{1,4} /.test(ln)) {
        flush();
        var lv = ln.match(/^#+/)[0].length;
        var hd = el('h' + (lv + 2)); hd.className = 'md-h'; inline(hd, ln.replace(/^#+ +/, '')); root.appendChild(hd);
      } else if (/^\s*(?:-{3,}|\*{3,})\s*$/.test(ln)) {
        flush();
        root.appendChild(el('hr'));
      } else if (/^>/.test(ln)) {
        flush();
        var bq = el('blockquote');
        for (; i < lines.length && /^>/.test(lines[i]); i++) {
          if (bq.childNodes.length) bq.appendChild(document.createElement('br'));
          inline(bq, lines[i].replace(/^> ?/, ''));
        }
        i--;
        root.appendChild(bq);
      } else if (/^\s*(?:[-*]|\d+[.)]) /.test(ln)) {
        if (para.length) flush();
        var tag = /^\s*\d+[.)] /.test(ln) ? 'ol' : 'ul';
        if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag); root.appendChild(list); }
        var li = el('li'); inline(li, ln.replace(/^\s*(?:[-*]|\d+[.)]) /, '')); list.appendChild(li);
      } else if (!ln.trim()) {
        flush();
      } else {
        list = null; para.push(ln);
      }
      i++;
    }
    flush();
    return root;
  }
  function card_md(cls, text) {
    var box = el('div', cls);
    box.appendChild(mdLite(text));
    return box;
  }
  function renderBody(text) {
    var node = mdLite(text);
    // 長い本文は折りたたむ（既定は閉じる）
    if (text.length <= 400 && text.split('\n').length <= 12) return node;
    var d = el('details', 'long');
    d.appendChild(el('summary', '', '詳細を表示（' + text.length + ' 文字）'));
    d.appendChild(node);
    return d;
  }

  var cards = []; // 質問カード: { el, q, inputs, read }
  var active = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setActive(card) {
    cards.forEach(function (c) { c.el.classList.toggle('active', c === card); });
    active = card;
    syncSide();
  }
  function scrollTo(card) {
    card.el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
  }
  function advance(card) {
    // 単一選択を選んだら、次の質問へ移る（最後の質問ではその場にとどまる）
    var next = cards[cards.indexOf(card) + 1];
    if (!next) return;
    setTimeout(function () { setActive(next); scrollTo(next); }, 220);
  }

  function extraBox(labelText, area, open) {
    var box = el('div', open ? 'extra open' : 'extra');
    box.appendChild(el('label', 'fl', labelText));
    box.appendChild(area);
    return box;
  }

  function renderQuestion(q) {
    var card = el('section', 'q');
    card.id = 'q-' + q.id;
    var h = el('h2');
    h.appendChild(el('span', 'pill', q.id));
    h.appendChild(document.createTextNode(q.title));
    h.appendChild(el('span', 'now', 'いま答えている質問'));
    card.appendChild(h);
    if (q.body) card.appendChild(renderBody(q.body));

    var rec = q.recommended || [];
    var inputs = [];
    var opts = el('div', 'opts');
    (q.options || []).forEach(function (o) {
      var label = el('label', rec.indexOf(o.key) >= 0 ? 'opt rec' : 'opt');
      var input = document.createElement('input');
      input.type = q.multi ? 'checkbox' : 'radio';
      input.name = q.id;
      input.value = o.key;
      inputs.push(input);
      label.appendChild(input);
      label.appendChild(el('span', 'cap', o.key));
      var box = el('span');
      box.appendChild(el('span', 'l', o.label));
      if (rec.indexOf(o.key) >= 0) box.appendChild(el('span', 'tag', '推奨'));
      if (o.desc) box.appendChild(el('span', 'd', o.desc));
      label.appendChild(box);
      opts.appendChild(label);
    });
    if (inputs.length) card.appendChild(opts);
    if (q.reason) card.appendChild(el('div', 'why', '推奨の理由: ' + q.reason));

    var hasOpts = inputs.length > 0;
    var note = document.createElement('textarea');
    var ask = document.createElement('textarea');
    var noteBox = extraBox(hasOpts
      ? 'コメント（候補を選んだときは理由・条件の補足。候補を選ばずに書けば、それが回答になります）'
      : 'コメント（自由記述。これが回答になります）', note, !hasOpts);
    var askBox = extraBox('聞き返し（Claude への質問。質問が分からない・確認したいことを書く。書くと「要確認」になり、次のラウンドで Claude が説明か補足質問を返します）', ask, false);

    var more = el('div', 'more');
    function toggle(text, box) {
      var b = el('button', 'tg', text);
      b.type = 'button';
      b.setAttribute('aria-expanded', box.classList.contains('open') ? 'true' : 'false');
      b.addEventListener('click', function () {
        b.setAttribute('aria-expanded', box.classList.toggle('open') ? 'true' : 'false');
      });
      return b;
    }
    var bNote = toggle('コメント', noteBox);
    var bAsk = toggle('聞き返す', askBox);
    note.addEventListener('input', function () { bNote.classList.toggle('dot', !!note.value.trim()); });
    ask.addEventListener('input', function () { bAsk.classList.toggle('dot', !!ask.value.trim()); });
    var held = false;
    var bHold = el('button', 'tg', 'あとで決める');
    bHold.type = 'button';
    bHold.setAttribute('aria-pressed', 'false');
    bHold.addEventListener('click', function () {
      held = !held;
      bHold.setAttribute('aria-pressed', held ? 'true' : 'false');
      card.classList.toggle('hold', held);
      syncSide();
    });
    more.appendChild(bNote);
    more.appendChild(bAsk);
    more.appendChild(bHold);
    if (hasOpts) {
      // 一度選ぶとラジオボタンは外せないので、選択なし（コメントだけ）に戻すボタンを置く
      var clear = el('button', 'clear', '選択をクリア');
      clear.type = 'button';
      clear.addEventListener('click', function () {
        inputs.forEach(function (i) { i.checked = false; });
        syncSide();
      });
      more.appendChild(clear);
    }
    card.appendChild(more);
    card.appendChild(noteBox);
    card.appendChild(askBox);

    content.appendChild(card);
    var read = function () {
      var sel = inputs.filter(function (i) { return i.checked; }).map(function (i) { return i.value; });
      var noteText = note.value.trim();
      var askText = ask.value.trim();
      var state = held ? '保留' : askText ? '要確認' : ((sel.length || noteText) ? '回答' : '未回答');
      return { id: q.id, sel: sel, note: noteText, ask: askText, state: state };
    };
    var entry = { el: card, q: q, inputs: inputs, read: read, multi: !!q.multi };
    cards.push(entry);
    blocks.push(read);
    var byMouse = false;
    card.addEventListener('click', function (e) {
      byMouse = e.detail > 0;
      if (active !== entry) setActive(entry);
    });
    card.addEventListener('change', function (e) {
      // 矢印キーで動かしただけでは移らない。マウスで選んだときだけ移る（文字キーは別に処理する）
      if (e.target.type === 'radio' && byMouse) advance(entry);
      byMouse = false;
      syncSide();
    });
    card.addEventListener('input', syncSide);
  }

  function oneLine(s) { return s.replace(/\r?\n/g, ' / '); }

  function buildQuestionsMd() {
    var unanswered = [];
    var md = '';
    blocks.forEach(function (read) {
      var r = read();
      if (r.state === '未回答') unanswered.push(r.id);
      md += '## ' + r.id + '\n' +
        '- 選択: ' + r.sel.join(', ') + '\n' +
        '- コメント: ' + oneLine(r.note) + '\n' +
        '- 聞き返し: ' + oneLine(r.ask) + '\n' +
        '- 状態: ' + r.state + '\n';
    });
    return { md: md, unanswered: unanswered };
  }

  var approveGet = null;
  function renderFinal() {
    if (data.intro) content.appendChild(card_md('intro', data.intro));
    content.appendChild(card_md('summary', data.summary || ''));
    var card = el('section', 'q approve');
    card.appendChild(el('h2', '', '承認'));
    var row = el('div', 'seg');
    ['承認', '修正あり'].forEach(function (v, i) {
      var l = el('label');
      var r = document.createElement('input');
      r.type = 'radio'; r.name = 'approve'; r.value = v;
      if (i === 0) r.checked = false;
      l.appendChild(r);
      l.appendChild(document.createTextNode(' ' + v));
      row.appendChild(l);
    });
    card.appendChild(row);
    var f = el('label', 'field', '修正コメント（「修正あり」の場合は必須）');
    var ta = document.createElement('textarea');
    f.appendChild(ta);
    card.appendChild(f);
    content.appendChild(card);
    approveGet = function () {
      var c = card.querySelector('input[name=approve]:checked');
      return { verdict: c ? c.value : '', comment: ta.value.trim() };
    };
  }

  // 入力フォーム: 依頼文・参考資料・保存先
  var intakeGet = null;
  function intakeMarkdown(it, refresh) {
    var md = '---\nsession: ' + data.session + '\nintake: 1\n---\n';
    if (refresh) md += '## 更新\n- 読み直し: はい\n\n';
    md += '## 依頼文\n- 種別: ' + (it.kind === 'file' ? 'ファイル' : 'テキスト') + '\n' +
      (it.kind === 'file' ? it.requestFile : it.request) + '\n\n';
    if (refresh) {
      // 選ばれていない側の入力も退避する（作り直しで消えないように）
      var other = it.kind === 'file' ? it.request : it.requestFile;
      if (other) {
        md += '## 保留の依頼文\n- 種別: ' + (it.kind === 'file' ? 'テキスト' : 'ファイル') + '\n' + other + '\n\n';
      }
    }
    md += '## 参考資料\n';
    it.paths.forEach(function (p) { md += '- ' + p + '\n'; });
    md += '\n## 保存先\n' + it.dest.replace(/\s*\r?\n\s*/g, ' ') + '\n';
    return md;
  }

  function renderIntake() {
    if (data.intro) content.appendChild(card_md('intro', data.intro));
    var root = data.tree;
    var sep = root.path.indexOf('\\') >= 0 ? '\\' : '/';
    function withSep(d) { return d.charAt(d.length - 1) === sep ? d : d + sep; }
    var open = {};
    open[root.path] = true;
    var nodes = {};      // フォルダのパス → ノード
    var fileSet = {};    // 一覧にあるファイルのフルパス
    (function index(n) {
      nodes[n.path] = n;
      n.files.forEach(function (f) { fileSet[withSep(n.path) + f] = true; });
      n.dirs.forEach(index);
    })(root);
    function expandTo(p) {
      Object.keys(nodes).forEach(function (d) {
        if (p.indexOf(withSep(d)) === 0) open[d] = true;
      });
    }
    function dirOf(p) { return p.slice(0, p.lastIndexOf(sep)); }

    var ok = { docx: 1, pdf: 1, pptx: 1, xlsx: 1, md: 1, txt: 1 };
    function shown(n) {
      return n.files.filter(function (f) { return ok[f.split('.').pop().toLowerCase()]; });
    }

    // 状態（読み直しのときは、返した回答から復元する）
    var kind = data.kind === 'file' ? 'file' : 'text';
    var reqSel = { cur: root.path, file: '' };
    var inSel = { cur: root.path, picked: [], last: null };
    var outSel = { sel: root.path };
    var extraReq = '';
    var extraPaths = [];
    var extraOut = '';
    if (data.request_file) {
      if (fileSet[data.request_file]) { reqSel.file = data.request_file; reqSel.cur = dirOf(data.request_file); }
      else extraReq = data.request_file;
    }
    (data.paths || []).forEach(function (p) {
      if (fileSet[p]) { inSel.picked.push(p); inSel.cur = dirOf(p); }
      else extraPaths.push(p);
    });
    if (data.dest && data.dest !== data.cwd) {
      if (nodes[data.dest]) outSel.sel = data.dest;
      else extraOut = data.dest;
    }
    [reqSel.file].concat(inSel.picked).concat([outSel.sel]).forEach(function (p) { if (p) expandTo(p); });

    // 依頼文
    var rcard = el('section', 'q');
    rcard.appendChild(el('h2', '', '依頼文'));
    rcard.appendChild(el('p', 'note', 'テキストを書くか、ファイルを選ぶか、どちらかで渡します。'));
    var seg = el('div', 'seg in-kind');
    [['text', 'テキスト'], ['file', 'ファイル']].forEach(function (k) {
      var l = el('label');
      var r = document.createElement('input');
      r.type = 'radio'; r.name = 'kind'; r.value = k[0];
      r.checked = kind === k[0];
      r.addEventListener('change', function () { kind = k[0]; syncKind(); });
      l.appendChild(r);
      l.appendChild(document.createTextNode(k[1]));
      seg.appendChild(l);
    });
    rcard.appendChild(seg);
    var textBox = el('div', 'in-box');
    var req = document.createElement('textarea');
    req.style.minHeight = '120px';
    req.placeholder = '何を詰めたいか、背景、分かっている制約など';
    req.value = data.request || '';
    textBox.appendChild(req);
    rcard.appendChild(textBox);
    var fileBox = el('div', 'in-box');
    fileBox.appendChild(el('p', 'note', '依頼文のファイル（作業フォルダの中から 1 つ）'));
    var reqPick = el('div', 'in-pick');
    var reqTree = el('div', 'in-tree');
    var reqFiles = el('div', 'in-files');
    reqPick.appendChild(reqTree);
    reqPick.appendChild(reqFiles);
    fileBox.appendChild(reqPick);
    var reqPath = document.createElement('input');
    reqPath.type = 'text';
    reqPath.placeholder = '作業フォルダの外のファイルは、パスをここに書く（書くと上の選択より優先）';
    reqPath.value = extraReq;
    fileBox.appendChild(reqPath);
    var reqSum = el('p', 'note');
    fileBox.appendChild(reqSum);
    rcard.appendChild(fileBox);
    content.appendChild(rcard);

    // 参考資料
    var icard = el('section', 'q');
    icard.appendChild(el('h2', '', '参考資料'));
    icard.appendChild(el('p', 'note',
      '左のフォルダをクリックすると、右に資料（docx・pdf・pptx・xlsx・md・txt）が出ます。別のフォルダへ移っても、チェックは残ります。' +
      'Shift を押しながらクリックすると、前にクリックしたファイルから範囲でまとめて選べます。'));
    var inPick = el('div', 'in-pick');
    var inTree = el('div', 'in-tree');
    var inFiles = el('div', 'in-files');
    inPick.appendChild(inTree);
    inPick.appendChild(inFiles);
    icard.appendChild(inPick);
    var paths = document.createElement('textarea');
    paths.placeholder = '作業フォルダの外のファイルやフォルダは、パスをここに書く（1 行 1 つ）';
    paths.value = extraPaths.join('\n');
    icard.appendChild(paths);
    var chosen = el('div', 'in-chosen');
    icard.appendChild(chosen);
    content.appendChild(icard);

    // 保存先
    var scard = el('section', 'q');
    scard.appendChild(el('h2', '', '保存先（親フォルダ）'));
    scard.appendChild(el('p', 'note', 'SPEC を置くフォルダを、作業フォルダの中から 1 つ選びます。初期値は作業フォルダ自身です。'));
    var outPick = el('div', 'in-pick one');
    var outTree = el('div', 'in-tree');
    outPick.appendChild(outTree);
    scard.appendChild(outPick);
    var outPath = document.createElement('input');
    outPath.type = 'text';
    outPath.placeholder = '作業フォルダの外に置くときは、パスをここに書く（書くと上の選択より優先）';
    outPath.value = extraOut;
    scard.appendChild(outPath);
    var outSum = el('p', 'note');
    scard.appendChild(outSum);
    content.appendChild(scard);

    // フォルダの読み直し
    var rf = el('section', 'q in-refresh');
    var rfBtn = el('button', '', 'フォルダを読み直す');
    rf.appendChild(rfBtn);
    rf.appendChild(el('span', 'note', '作業フォルダにファイルを足したら押してください。入力した内容とチェックは、そのまま残ります。'));
    content.insertBefore(rf, rcard);

    function lines(s) {
      return s.split(/\r?\n/).map(function (l) { return l.trim().replace(/^"(.*)"$/, '$1'); }).filter(Boolean);
    }

    // ツリー（radio: 保存先用。フォルダをクリックするとラジオも選ぶ）
    function drawTree(box, tag, getCur, setCur, radio) {
      var scroll = box.scrollTop;
      box.textContent = '';
      (function walk(n, depth) {
        var row = el('div', 'in-node' + (getCur() === n.path ? ' cur' : ''));
        row.tabIndex = 0;
        row.dataset.fk = 'n:' + tag + ':' + n.path;
        row.style.paddingLeft = (6 + depth * 14) + 'px';
        var has = n.dirs.length > 0;
        row.appendChild(el('span', 'in-tw', has ? (open[n.path] ? '▼' : '▶') : ''));
        if (radio) {
          var r = document.createElement('input');
          r.type = 'radio'; r.name = 'out'; r.checked = getCur() === n.path; r.tabIndex = -1;
          row.appendChild(r);
        }
        row.appendChild(document.createTextNode(depth === 0 ? n.name + '（作業フォルダ）' : n.name));
        var pick = function () {
          if (has) open[n.path] = !open[n.path];
          setCur(n.path);
          draw();
        };
        row.addEventListener('click', pick);
        row.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
        });
        box.appendChild(row);
        if (n.truncated) {
          var tn = el('div', 'note warn', '件数が多いため一部だけ表示しています。パス欄を使ってください。');
          tn.style.paddingLeft = (6 + (depth + 1) * 14) + 'px';
          box.appendChild(tn);
        }
        if (has && open[n.path]) n.dirs.forEach(function (c) { walk(c, depth + 1); });
      })(root, 0);
      box.scrollTop = scroll;
    }

    function drawFiles(box, tag, cur, multi) {
      var n = nodes[cur];
      var scroll = box.scrollTop;
      box.textContent = '';
      box.appendChild(el('div', 'in-where', n.path));
      var fs = shown(n);
      if (!fs.length) box.appendChild(el('div', 'note', 'このフォルダに、読める資料はありません。'));
      if (n.truncated) box.appendChild(el('div', 'note warn', '件数が多いため一部だけ表示しています。パス欄を使ってください。'));
      fs.forEach(function (f, idx) {
        var full = withSep(n.path) + f;
        var l = el('label', 'in-file');
        var c = document.createElement('input');
        c.type = multi ? 'checkbox' : 'radio';
        if (!multi) c.name = 'reqfile';
        c.checked = multi ? inSel.picked.indexOf(full) >= 0 : reqSel.file === full;
        c.dataset.fk = 'f:' + tag + ':' + full;
        l.appendChild(c);
        l.appendChild(document.createTextNode(f));
        // クリックはラベルで受ける（名前のクリックだと、ブラウザが転送するクリックから Shift が落ちるため）
        l.addEventListener('click', function (e) {
          e.preventDefault();
          if (!multi) {
            reqSel.file = reqSel.file === full ? '' : full;
            draw();
            return;
          }
          var on = inSel.picked.indexOf(full) < 0;
          var from = idx;
          var to = idx;
          if (e.shiftKey && inSel.last && inSel.last.dir === n.path) {
            from = Math.min(inSel.last.i, idx);
            to = Math.max(inSel.last.i, idx);
          }
          for (var k = from; k <= to; k++) {
            var q = withSep(n.path) + fs[k];
            var at = inSel.picked.indexOf(q);
            if (on && at < 0) inSel.picked.push(q);
            if (!on && at >= 0) inSel.picked.splice(at, 1);
          }
          inSel.last = { dir: n.path, i: idx };
          draw();
        });
        box.appendChild(l);
      });
      box.scrollTop = scroll;
    }

    function drawChosen() {
      var all = inSel.picked.concat(lines(paths.value));
      chosen.textContent = '';
      chosen.appendChild(el('b', '', all.length ? '選択中（' + all.length + ' 件）' : '選択中'));
      if (!all.length) chosen.appendChild(document.createTextNode(' なし'));
      all.forEach(function (p) {
        var row = el('div', 'in-it');
        row.appendChild(el('span', 'in-p', p));
        if (inSel.picked.indexOf(p) >= 0) {
          var b = el('button', 'clear', '外す');
          b.addEventListener('click', function () {
            inSel.picked.splice(inSel.picked.indexOf(p), 1);
            draw();
          });
          row.appendChild(b);
        } else {
          row.appendChild(el('span', 'in-tag', 'パス欄'));
        }
        chosen.appendChild(row);
      });
    }

    function current() {
      return {
        kind: kind,
        request: req.value.trim(),
        requestFile: lines(reqPath.value)[0] || reqSel.file,
        paths: inSel.picked.concat(lines(paths.value)),
        dest: lines(outPath.value)[0] || outSel.sel
      };
    }
    function syncKind() {
      textBox.style.display = kind === 'text' ? '' : 'none';
      fileBox.style.display = kind === 'file' ? '' : 'none';
    }
    function draw() {
      var ae = document.activeElement;
      var fk = ae && ae.dataset ? ae.dataset.fk : '';
      drawTree(reqTree, 'req', function () { return reqSel.cur; }, function (p) { reqSel.cur = p; }, false);
      drawFiles(reqFiles, 'req', reqSel.cur, false);
      drawTree(inTree, 'in', function () { return inSel.cur; }, function (p) { inSel.cur = p; }, false);
      drawFiles(inFiles, 'in', inSel.cur, true);
      drawTree(outTree, 'out', function () { return outSel.sel; }, function (p) { outSel.sel = p; }, true);
      drawChosen();
      var it = current();
      reqSum.textContent = '依頼文のファイル: ' + (it.requestFile || 'なし');
      outSum.textContent = '保存先: ' + it.dest;
      if (fk) {
        var again = content.querySelector('[data-fk="' + fk.replace(/(["\\])/g, '\\$1') + '"]');
        if (again) again.focus();
      }
    }
    paths.addEventListener('input', drawChosen);
    [reqPath, outPath].forEach(function (i) { i.addEventListener('input', draw); });
    rfBtn.addEventListener('click', function () {
      window.__answersMd = intakeMarkdown(current(), true);
      window.__submitted = true;
      document.getElementById('submit').disabled = true;
      rfBtn.disabled = true;
      setStatus('読み直しを依頼しました。Claude が作り直して、開き直します。このページでは、もう送信できません。', 'ok');
    });
    syncKind();
    draw();

    intakeGet = current;
  }

  if (data.mode === 'intake') {
    renderIntake();
  } else if (data.mode === 'final') {
    renderFinal();
  } else {
    if (data.intro) content.appendChild(card_md('intro', data.intro));
    (data.questions || []).forEach(renderQuestion);
  }

  // 左の一覧: 進み具合と、質問画面では質問ごとの回答状況
  var STATE_MARK = { '回答': ['●', 'ok'], '保留': ['△', 'hold'], '要確認': ['?', 'ask'], '未回答': ['○', ''] };
  var idxLinks = [];
  var countEl = null;
  function buildSide() {
    var side = document.getElementById('side');
    var steps = ['入力', '事前確認', '質問', '最終確認'];
    var curIdx = data.mode === 'intake' ? 0 : data.mode === 'final' ? 3 : (data.round === 0 ? 1 : 2);
    side.appendChild(el('h2', '', '進み具合'));
    var ol = el('ol', 'steps');
    steps.forEach(function (name, i) {
      var text = name;
      if (i === curIdx && data.mode === 'round' && data.round > 0) text = '質問 第 ' + data.round + ' ラウンド';
      if (i === curIdx && data.mode === 'final') text = '最終確認 第 ' + data.round + ' 版';
      ol.appendChild(el('li', i < curIdx ? 'done' : i === curIdx ? 'cur' : '', text));
    });
    side.appendChild(ol);
    if (data.mode !== 'round' || !cards.length) return;
    side.appendChild(el('h2', '', 'この画面の質問'));
    var ul = el('ul', 'idx');
    cards.forEach(function (c) {
      var li = el('li');
      var a = el('a');
      a.href = '#' + c.el.id;
      a.appendChild(el('span', '', c.q.id));
      a.appendChild(el('span', 't', c.q.title));
      var st = el('span', 'st', '○');
      a.appendChild(st);
      a.addEventListener('click', function (e) { e.preventDefault(); setActive(c); scrollTo(c); });
      li.appendChild(a);
      ul.appendChild(li);
      idxLinks.push({ a: a, st: st, card: c });
    });
    side.appendChild(ul);
    countEl = el('p', 'count');
    side.appendChild(countEl);
  }
  function syncSide() {
    var n = 0;
    idxLinks.forEach(function (l) {
      var state = l.card.read().state;
      var mark = STATE_MARK[state];
      l.st.textContent = mark[0];
      l.st.className = 'st ' + mark[1];
      l.a.classList.toggle('cur', l.card === active);
      if (state === '回答') n++;
    });
    if (countEl) countEl.textContent = '回答 ' + n + ' / ' + cards.length;
  }
  buildSide();
  if (data.mode === 'round' && cards.length) {
    setActive(cards[0]);
    var hint = document.getElementById('hint');
    function kbd(t) { return el('kbd', '', t); }
    var h1 = el('span'); h1.appendChild(kbd('A')); h1.appendChild(document.createTextNode(' など候補の文字で選ぶ'));
    var h2 = el('span'); h2.appendChild(kbd('J')); h2.appendChild(kbd('K')); h2.appendChild(document.createTextNode(' 移動'));
    hint.appendChild(h1);
    hint.appendChild(h2);
  }
  document.addEventListener('keydown', function (e) {
    if (data.mode !== 'round' || !cards.length || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (/^(TEXTAREA|BUTTON|SUMMARY)$/.test(t.tagName) || (t.tagName === 'INPUT' && t.type === 'text')) return;
    var k = e.key.toLowerCase();
    if (k === 'j' || k === 'k') {
      var i = Math.max(0, Math.min(cards.length - 1, cards.indexOf(active) + (k === 'j' ? 1 : -1)));
      setActive(cards[i]);
      scrollTo(cards[i]);
    } else if (active) {
      var inp = active.inputs.filter(function (x) { return x.value.toLowerCase() === k; })[0];
      if (!inp) return;
      e.preventDefault();
      inp.checked = inp.type === 'radio' ? true : !inp.checked;
      if (inp.type === 'radio') advance(active);
      syncSide();
    }
  });

  function build() {
    // 最終確認は round ではなく final（版番号）として書き、ラウンドの回答と区別する
    var head = '---\nsession: ' + data.session + '\n' +
      (data.mode === 'intake' ? 'intake: 1' : (data.mode === 'final' ? 'final: ' : 'round: ') + data.round) + '\n---\n';
    if (data.mode === 'intake') {
      var it = intakeGet();
      var hasReq = it.kind === 'file' ? !!it.requestFile : !!it.request;
      if (!hasReq && !it.paths.length) {
        return { error: '依頼文か参考資料のどちらかを入力してください。' };
      }
      return { md: intakeMarkdown(it, false) };
    }
    if (data.mode === 'final') {
      var a = approveGet();
      if (!a.verdict) return { error: '「承認」か「修正あり」を選んでください。' };
      if (a.verdict === '修正あり' && !a.comment) return { error: '修正コメントを入力してください。' };
      return { md: head + '## 承認\n- 判定: ' + a.verdict + '\n- コメント: ' + oneLine(a.comment) + '\n' };
    }
    var q = buildQuestionsMd();
    return { md: head + q.md, unanswered: q.unanswered };
  }

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  document.getElementById('submit').addEventListener('click', function () {
    var r = build();
    if (r.error) { setStatus(r.error, 'warn'); return; }
    if (r.unanswered && r.unanswered.length && !window.__forceSubmit) {
      window.__forceSubmit = true; // 2回目の押下で未回答のまま送信
      setStatus('未回答: ' + r.unanswered.join(', ') + '。このままなら、もう一度「送信」を押してください。', 'warn');
      return;
    }
    window.__answersMd = r.md;
    window.__submitted = true;
    setStatus('送信しました。Claude が自動で受け取ります。', 'ok');
  });

  // 中止: 2回目の押下で確定する（alert/confirm はブラウザ操作が止まるので使わない）
  var abortArmed = false;
  document.getElementById('abort').addEventListener('click', function () {
    if (!abortArmed) {
      abortArmed = true;
      setStatus('grilling を中止します。よければ、もう一度「中止」を押してください。', 'warn');
      return;
    }
    var head = '---\nsession: ' + data.session + '\n' +
      (data.mode === 'intake' ? 'intake: 1' : (data.mode === 'final' ? 'final: ' : 'round: ') + data.round) + '\n---\n';
    window.__answersMd = head + '## 中止\n- 判定: 中止\n';
    window.__aborted = true;
    window.__submitted = true;
    setStatus('中止しました。Claude が自動で受け取ります。', 'ok');
  });

  document.getElementById('copy').addEventListener('click', function () {
    var r = build();
    if (r.error) { setStatus(r.error, 'warn'); return; }
    var done = function () {
      setStatus('Markdown をコピーしました。', 'ok');
    };
    var fallback = function () {
      var t = document.createElement('textarea');
      t.value = r.md; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { setStatus('コピーに失敗しました。', 'warn'); }
      document.body.removeChild(t);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(r.md).then(done, fallback);
    } else { fallback(); }
  });
})();
</script>
</body>
</html>
